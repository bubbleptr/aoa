<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
  <title id="t">aoa 架构</title>
  <desc id="d">事件从入口经通道进入内核的 inbox；worker 认领事件、开一次 run 交给 runtime；工具调用和审批经过权限；消息从 outbox 送回给你；一切状态存在一个 SQLite 文件里。runtime 分两档：第一档 pi，第二档 Codex 和 dsh。</desc>
  <style>
    .bg { fill: #ffffff; }
    .zone { fill: #f6f7f9; stroke: #d5d9e0; }
    .kernel { fill: #eef4ff; stroke: #9db8e8; }
    .box { fill: #ffffff; stroke: #b7bfcc; }
    .prim { fill: #ffffff; stroke: #5b84d6; stroke-width: 1.4; }
    .t1 { fill: #f1faf3; stroke: #7cbf8e; }
    .t2 { fill: #fff7ec; stroke: #e0a85c; }
    .sub { fill: #ffffff; stroke: #e0a85c; }
    .store { fill: #f3f0fa; stroke: #a594d4; }
    .h { font: 600 15px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #1f2733; }
    .n { font: 600 13.5px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #1f2733; }
    .s { font: 12px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #5a6575; }
    .m { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5a6575; }
    .lbl { font: 11.5px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #3d5d9e; }
    .edge { stroke: #6f7d93; stroke-width: 1.4; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .head { fill: #6f7d93; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .zone { fill: #161b22; stroke: #30363d; }
      .kernel { fill: #121d33; stroke: #3b5a96; }
      .box, .prim, .sub { fill: #0d1117; }
      .box { stroke: #4a5361; }
      .prim { stroke: #6f97e6; }
      .t1 { fill: #0f2117; stroke: #3f8a55; }
      .t2 { fill: #261b0c; stroke: #b07a33; }
      .sub { stroke: #b07a33; }
      .store { fill: #1c1730; stroke: #7a68b8; }
      .h, .n { fill: #e6edf3; }
      .s, .m { fill: #9aa6b5; }
      .lbl { fill: #8fb1f2; }
      .edge { stroke: #8b96a8; }
      .head { fill: #8b96a8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="540"/>

  <!-- 入口 · 通道（简化） -->
  <rect class="box" x="16" y="70" width="128" height="372" rx="10"/>
  <text class="n" x="30" y="98">你</text>
  <text class="s" x="30" y="120">CLI · MCP</text>
  <text class="s" x="30" y="138">GitHub issue</text>
  <text class="m" x="30" y="420">通道：local</text>
  <text class="m" x="30" y="436">/ github</text>

  <!-- 内核 -->
  <rect class="kernel" x="180" y="16" width="420" height="440" rx="12"/>
  <text class="h" x="198" y="44">内核 · 五个原语</text>

  <rect class="prim" x="198" y="62" width="186" height="66" rx="8"/>
  <text class="n" x="212" y="87">Inbox</text>
  <text class="s" x="212" y="109">收事件 · 去重 · 租约 · 重试</text>
  <rect class="prim" x="396" y="62" width="186" height="66" rx="8"/>
  <text class="n" x="410" y="87">Timers</text>
  <text class="s" x="410" y="109">wake_me_at，到期变成事件</text>

  <rect class="box" x="198" y="160" width="384" height="66" rx="8"/>
  <text class="n" x="212" y="185">Worker</text>
  <text class="s" x="212" y="207">认领一批事件 → 开一次 run → 记下结局，崩溃后接着做</text>

  <rect class="prim" x="198" y="258" width="186" height="66" rx="8"/>
  <text class="n" x="212" y="283">Memory</text>
  <text class="s" x="212" y="305">指令 · 笔记 · 进度 · 已发消息</text>
  <rect class="prim" x="396" y="258" width="186" height="66" rx="8"/>
  <text class="n" x="410" y="283">Permissions</text>
  <text class="s" x="410" y="305">策略 · 分类器 · 审批 · 许可</text>

  <rect class="prim" x="198" y="356" width="384" height="66" rx="8"/>
  <text class="n" x="212" y="381">Outbox</text>
  <text class="s" x="212" y="403">消息 · 审批请求 · 至多送达一次</text>

  <!-- 存储 -->
  <rect class="store" x="180" y="474" width="420" height="50" rx="10"/>
  <text class="n" x="198" y="504">SQLite</text>
  <text class="s" x="252" y="504">一个文件（WAL）：事件、会话、日志、决定、消息</text>

  <!-- runtime -->
  <text class="h" x="638" y="44">Runtime · 每个 agent 选一个</text>
  <rect class="t1" x="636" y="62" width="348" height="112" rx="10"/>
  <text class="n" x="652" y="88">第一档 · pi</text>
  <text class="s" x="652" y="112">只有 aoa 给的工具（读写、bash、记忆、通知……）</text>
  <text class="s" x="652" y="132">每次调用都过内核 Tool.invoke：</text>
  <text class="s" x="652" y="152">裁决、写日志、执行，崩溃后按日志重放</text>

  <rect class="t2" x="636" y="198" width="348" height="258" rx="10"/>
  <text class="n" x="652" y="224">第二档 · 外部 harness</text>
  <text class="s" x="652" y="248">用自己的工具和沙箱；它要问的审批交给内核转给你，</text>
  <text class="s" x="652" y="266">批准后记一次性许可，它重做时直接放行</text>
  <rect class="sub" x="652" y="284" width="154" height="90" rx="8"/>
  <text class="n" x="664" y="306">Codex</text>
  <text class="m" x="664" y="326">codex app-server</text>
  <text class="s" x="664" y="346">aoa 工具：动态工具</text>
  <text class="s" x="664" y="363">审查：auto review</text>
  <rect class="sub" x="816" y="284" width="154" height="90" rx="8"/>
  <text class="n" x="828" y="306">dsh</text>
  <text class="m" x="828" y="326">dsh --profile sdk</text>
  <text class="s" x="828" y="346">aoa 工具：MCP 桥</text>
  <text class="s" x="828" y="363">权限：dsh.preset</text>
  <text class="s" x="652" y="400">aoa 自己的工具（记忆、通知、ask_user、send_to）</text>
  <text class="s" x="652" y="418">在这里仍然过内核，仍是第一档</text>

  <!-- 边 -->
  <path class="edge" marker-end="url(#a)" d="M144,95 H196"/>
  <text class="lbl" x="152" y="88">事件</text>
  <path class="edge" marker-end="url(#a)" d="M396,95 H386"/>
  <path class="edge" marker-end="url(#a)" d="M291,128 V158"/>
  <path class="edge dash" marker-end="url(#a)" d="M291,226 V256"/>
  <text class="lbl" x="298" y="246">加载</text>
  <path class="edge" marker-start="url(#a)" marker-end="url(#a)" d="M584,193 H610 V118 H634"/>
  <path class="edge" marker-end="url(#a)" d="M610,193 V240 H634"/>
  <text class="lbl" x="614" y="184">run</text>
  <path class="edge" marker-end="url(#a)" d="M634,300 H584"/>
  <text class="lbl" x="600" y="292">调用</text>
  <path class="edge" marker-end="url(#a)" d="M489,324 V354"/>
  <text class="lbl" x="496" y="344">审批请求</text>
  <path class="edge" marker-end="url(#a)" d="M196,389 H146"/>
  <text class="lbl" x="152" y="382">送达</text>
  <path class="edge" marker-start="url(#a)" marker-end="url(#a)" d="M390,456 V472"/>
</svg>
