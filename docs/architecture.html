<title>aoa Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a fixed 1200×750 stage captured as one image; the kernel in the middle, runtimes on the right, gaps wide enough for every arrow and its label. */
:root {
  --bg: #f7f8fb;
  --ink: #17202e;
  --muted: #5b6577;
  --line: #8a95a8;
  --kernel: #e9effb;
  --kernel-edge: #6f8fd6;
  --tile: #ffffff;
  --tile-edge: #c9d2e3;
  --prim: #2f5bd3;
  --builtin: #e6f4ee;
  --builtin-edge: #3f9a72;
  --ext: #fbf0e1;
  --ext-edge: #c8842d;
  --store: #efebf9;
  --store-edge: #8a74cf;
  --chip: #ffffff;
  --display: "Space Grotesk", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --body: "Inter", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --ink: #e8edf5; --muted: #9aa5b8; --line: #6b7689;
    --kernel: #142037; --kernel-edge: #5576c9; --tile: #101826; --tile-edge: #2c3a52; --prim: #8fb0ff;
    --builtin: #0f2a20; --builtin-edge: #4fb488; --ext: #2b1f0e; --ext-edge: #d99a45;
    --store: #1d1834; --store-edge: #9a86e0; --chip: #101826; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --ink: #e8edf5; --muted: #9aa5b8; --line: #6b7689;
  --kernel: #142037; --kernel-edge: #5576c9; --tile: #101826; --tile-edge: #2c3a52; --prim: #8fb0ff;
  --builtin: #0f2a20; --builtin-edge: #4fb488; --ext: #2b1f0e; --ext-edge: #d99a45;
  --store: #1d1834; --store-edge: #9a86e0; --chip: #101826; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scroll { overflow-x: auto; }
.stage { position: relative; width: 1200px; height: 750px; margin: 0 auto; }
.stage > svg { position: absolute; inset: 0; pointer-events: none; }
.abs { position: absolute; box-sizing: border-box; }

.title { left: 24px; top: 20px; }
.title b { font: 700 30px/1 var(--display); letter-spacing: -0.01em; }
.title span { margin-left: 12px; font: 500 15px var(--display); color: var(--muted); }

.region { border-radius: 18px; border: 1.5px solid; }
.region > .label { position: absolute; left: 22px; top: 16px; font: 600 15px var(--display); letter-spacing: 0.02em; }
.region > .label small { font: 500 12.5px var(--body); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.kernel { left: 240px; top: 84px; width: 530px; height: 536px; background: var(--kernel); border-color: var(--kernel-edge); }
.runtime { left: 870px; top: 84px; width: 306px; height: 536px; border-color: var(--tile-edge); border-style: dashed; }
.store { left: 240px; top: 668px; width: 530px; height: 58px; background: var(--store); border-color: var(--store-edge); display: flex; align-items: center; gap: 14px; padding: 0 22px; }
.store b { font: 600 16px var(--display); }
.store span { font-size: 13.5px; color: var(--muted); }

.tile { background: var(--tile); border: 1.5px solid var(--tile-edge); border-radius: 12px; padding: 0 18px; display: flex; flex-direction: column; justify-content: center; gap: 4px; height: 70px; }
.tile.prim { border-color: var(--prim); }
.tile b { font: 600 16px var(--display); }
.tile.prim b { color: var(--prim); }
.tile span { font-size: 13px; color: var(--muted); }
.col1 { left: 264px; width: 213px; }
.col2 { left: 533px; width: 213px; }
.wide { left: 264px; width: 482px; }

.you { left: 24px; top: 140px; width: 176px; }

.card { left: 894px; width: 258px; border-radius: 14px; border: 1.5px solid; padding: 16px 18px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.card .kind { font: 600 11.5px var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card b { font: 700 22px var(--display); }
.card p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.builtin { top: 140px; height: 140px; background: var(--builtin); border-color: var(--builtin-edge); }
.ext { top: 320px; height: 274px; background: var(--ext); border-color: var(--ext-edge); }
.ext .pair { display: grid; gap: 10px; }
.ext .pair div { background: var(--chip); border: 1px solid var(--ext-edge); border-radius: 10px; padding: 10px 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ext .pair b { font-size: 16px; }
.ext .pair code { font: 500 11.5px var(--mono); color: var(--muted); }

.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
.dash { stroke-dasharray: 5 5; }
.tip { fill: var(--line); }
.lbl { font: 500 12.5px var(--body); fill: var(--muted); }
</style>

<div class="scroll">
<div class="stage" role="img" aria-label="aoa 架构：你交代的任务进入内核的 inbox，worker 开一次 run 交给 runtime，工具调用经过权限，消息从 outbox 回到你；状态存在 SQLite。runtime 有内置的 pi 和外部 harness（Codex、dsh）。">

  <div class="abs title"><b>aoa</b><span>一个常驻 agent 的内核</span></div>

  <div class="abs tile you"><b>你</b><span>CLI · MCP · GitHub</span></div>

  <div class="abs region kernel"><div class="label">内核<small>五个原语</small></div></div>
  <div class="abs tile prim col1" style="top:140px"><b>Inbox</b><span>收事件</span></div>
  <div class="abs tile prim col2" style="top:140px"><b>Timers</b><span>定时唤醒</span></div>
  <div class="abs tile wide" style="top:266px"><b>Worker</b><span>认领事件，开一次 run</span></div>
  <div class="abs tile prim col1" style="top:392px"><b>Memory</b><span>指令 · 笔记 · 进度</span></div>
  <div class="abs tile prim col2" style="top:392px"><b>Permissions</b><span>裁决每次工具调用</span></div>
  <div class="abs tile prim wide" style="top:518px"><b>Outbox</b><span>消息和审批请求</span></div>

  <div class="abs region store"><b>SQLite</b><span>全部状态在一个文件里</span></div>

  <div class="abs region runtime"><div class="label">Runtime<small>每个 agent 选一个</small></div></div>
  <div class="abs card builtin">
    <span class="kind">Built-in</span>
    <b>pi</b>
    <p>工具调用都经过内核</p>
  </div>
  <div class="abs card ext">
    <span class="kind">外部 harness</span>
    <div class="pair">
      <div><b>Codex</b><code>app-server</code></div>
      <div><b>dsh</b><code>--profile sdk</code></div>
    </div>
    <p>用自己的工具和沙箱，要问的审批经内核转给你</p>
  </div>

  <svg viewBox="0 0 1200 750" width="1200" height="750" aria-hidden="true">
    <defs>
      <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path class="tip" d="M0,0 L10,5 L0,10 z"/>
      </marker>
    </defs>
    <!-- you → Inbox -->
    <path class="edge" marker-end="url(#tip)" d="M202,175 H261"/>
    <text class="lbl" x="231" y="165" text-anchor="middle">任务</text>
    <!-- Outbox → you -->
    <path class="edge" marker-end="url(#tip)" d="M262,553 H112 V213"/>
    <text class="lbl" x="187" y="543" text-anchor="middle">消息</text>
    <!-- Timers → Inbox -->
    <path class="edge" marker-end="url(#tip)" d="M531,175 H480"/>
    <text class="lbl" x="505" y="165" text-anchor="middle">到期</text>
    <!-- Inbox → Worker -->
    <path class="edge" marker-end="url(#tip)" d="M370,212 V263"/>
    <!-- Worker → Memory -->
    <path class="edge dash" marker-end="url(#tip)" d="M370,338 V389"/>
    <text class="lbl" x="382" y="368">加载</text>
    <!-- Permissions → Outbox -->
    <path class="edge" marker-end="url(#tip)" d="M640,464 V515"/>
    <text class="lbl" x="652" y="494">审批请求</text>
    <!-- Worker → runtime -->
    <path class="edge" marker-end="url(#tip)" d="M748,301 H867"/>
    <text class="lbl" x="808" y="291" text-anchor="middle">run</text>
    <!-- runtime → Permissions -->
    <path class="edge" marker-end="url(#tip)" d="M868,427 H749"/>
    <text class="lbl" x="808" y="417" text-anchor="middle">工具调用</text>
    <!-- kernel ↔ store -->
    <path class="edge" marker-start="url(#tip)" marker-end="url(#tip)" d="M505,622 V666"/>
  </svg>
</div>
</div>
<script>
// "#light" or "#dark" pins the theme, for capturing both images.
const pin = () => { const t = location.hash.slice(1); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; };
pin(); addEventListener("hashchange", pin);
</script>
