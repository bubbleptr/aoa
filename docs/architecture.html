<style>
/* Layout: a fixed 1114×648 stage captured as one image; the kernel in the middle, runtimes on the right. Boxes fit their text; the gaps are sized for the arrows. */
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --ink: #e8edf5; --muted: #9aa5b8; --line: #6b7689;
    --kernel: #142037; --kernel-edge: #5576c9; --tile: #101826; --tile-edge: #2c3a52; --prim: #8fb0ff; --icon-bg: #1b2a4a;
    --builtin: #0f2a20; --builtin-edge: #4fb488; --ext: #2b1f0e; --ext-edge: #d99a45;
    --store: #1d1834; --store-edge: #9a86e0; --chip: #101826; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --ink: #e8edf5; --muted: #9aa5b8; --line: #6b7689;

}

body {

.scroll { overflow-x: auto; }
.stage { position: relative; width: 1114px; height: 648px; margin: 0 auto; }
.stage > svg { position: absolute; inset: 0; pointer-events: none; }
.abs { position: absolute; box-sizing: border-box; }

.title { left: 24px; top: 20px; }
.title b { font: 700 30px/1 var(--display); letter-spacing: -0.01em; }
.title span { margin-left: 12px; font: 500 15px var(--display); color: var(--muted); }

.region { border-radius: 18px; border: 1.5px solid; }
.region > .label { position: absolute; left: 22px; top: 14px; font: 600 15px var(--display); letter-spacing: 0.02em; }
.region > .label small { font: 500 12.5px var(--body); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.kernel { left: 224px; top: 80px; width: 480px; height: 456px; background: var(--kernel); border-color: var(--kernel-edge); }
.runtime { left: 790px; top: 80px; width: 300px; height: 400px; border-color: var(--tile-edge); border-style: dashed; }
.store { left: 224px; top: 572px; width: 480px; height: 52px; background: var(--store); border-color: var(--store-edge); display: flex; align-items: center; gap: 12px; padding: 0 20px; }
.store b { font: 600 16px var(--display); }
.store span { font-size: 13.5px; color: var(--muted); }
.store svg { color: var(--store-edge); }

.tile { background: var(--tile); border: 1.5px solid var(--tile-edge); border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 12px; height: 60px; }
.tile.prim { border-color: var(--prim); }
.tile .ic { flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--icon-bg); color: var(--prim); display: grid; place-items: center; }
.tile:not(.prim) .ic { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }
.tile .tx { display: flex; flex-direction: column; gap: 2px; }
.tile b { font: 600 15.5px var(--display); }
.tile.prim b { color: var(--prim); }
.tile span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.col1 { left: 248px; width: 186px; }
.col2 { left: 494px; width: 186px; }
.wide { left: 248px; width: 432px; }
.you { left: 24px; top: 128px; width: 168px; padding: 0 10px; gap: 10px; }
.you .ic { width: 30px; height: 30px; }

.card { left: 810px; width: 260px; border-radius: 14px; border: 1.5px solid; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card .kind { font: 600 11px var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.builtin { top: 128px; height: 104px; background: var(--builtin); border-color: var(--builtin-edge); }
.builtin .row { display: flex; align-items: center; gap: 10px; }
.builtin .row b { font: 700 20px var(--display); }
.pi { width: 30px; height: 30px; border-radius: 8px; background: var(--chip); border: 1px solid var(--builtin-edge); padding: 3px; box-sizing: border-box; }
.ext { top: 256px; height: 200px; background: var(--ext); border-color: var(--ext-edge); }
.ext .pair { display: grid; gap: 8px; }
.ext .pair div { background: var(--chip); border: 1px solid var(--ext-edge); border-radius: 10px; padding: 7px 12px 7px 8px; display: flex; align-items: center; gap: 10px; }
.ext .pair .logo { width: 24px; height: 24px; flex: none; color: var(--ink); }
.ext .pair b { font: 600 15.5px var(--display); }
.ext .pair code { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); }

.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
.dash { stroke-dasharray: 5 5; }
.tip { fill: var(--line); }
.lbl { font: 500 12px var(--body); fill: var(--muted); }
.i { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
